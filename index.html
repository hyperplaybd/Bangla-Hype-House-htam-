 return out+esc(raw.slice(i))}

/* ---- encryption (runs in the browser; server never sees plain text) ---- */
async function genKeys(){const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);return{pub:await crypto.subtle.exportKey('jwk',k.publicKey),prv:await crypto.subtle.exportKey('jwk',k.privateKey)}}
async function aes(prv,pub){const a=await crypto.subtle.importKey('jwk',prv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']),b=await crypto.subtle.importKey('jwk',pub,{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:b},a,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function keyFor(u){if(!CR||!K||!u.pub)return null;return KC[u.id]||(KC[u.id]=await aes(K.prv,u.pub))}
async function encR(t,k){if(!k)return{ct:b64(E8.encode(t)),iv:''};const iv=crypto.getRandomValues(new Uint8Array(12));return{ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,E8.encode(t))),iv:b64(iv)}}
async function decR(m,k){if(!k||!m.iv)return D8.decode(ub(m.ct));return D8.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(m.iv)},k,ub(m.ct)))}
async function hydrate(){for(const id in S.chats){const c=S.chats[id];for(const m of c.msgs){if(PT[m.id]===undefined){try{PT[m.id]=await decR(m,await keyFor(c.user))}catch(e){PT[m.id]='This message could not be decrypted'}}}}}

}
async function local(a,d){
 if(S.day!==today()){S.day=today();S.used=0}
 const A=S.adm,id=()=>Date.now()+Math.floor(Math.random()*999);
 if(a==='search'){const q=d.q.toLowerCase();if(q.length<3)return{error:'nf'};let p=S.peers[q];if(!p&&CR)p=S.peers[q]=await genKeys();return{user:{id:'u_'+q,name:d.q,username:q,pub:p&&p.pub}}}
 if(a==='start'){if(S.blocked.some(b=>b.id===d.user.id))return{error:'blocked'};if(!S.prem&&S.used>=CFG.FREE)return{error:'limit'};S.used++;S.chats[d.user.id]={user:d.user,msgs:[],unread:0};save();return{ok:1}}
 if(a==='send'){demoReply(d.to);return{ok:1}}
 if(a==='pay'){A.pay.push({id:id(),user:S.me,method:d.method,trx:d.trx,price:d.price,t:Date.now(),status:'pending'});S.pend=true;save();return{ok:1}}
 if(a==='report'){A.rep.push({id:id(),by:S.me,against:S.chats[d.to].user,reason:d.reason,evidence:d.evidence,t:Date.now(),status:'open'});save();return{ok:1}}
 if(a==='problem'){A.prob.push({id:id(),user:S.me,text:d.text,t:Date.now(),status:'open'});save();return{ok:1}}
 if(a==='admin_get')return{pay:A.pay,rep:A.rep,prob:A.prob,methods:S.methods};
 if(a==='admin_pay'){const p=A.pay.find(x=>x.id===d.id);p.status=d.decision;if(d.decision==='approved')S.prem=true;S.pend=A.pay.some(x=>x.status==='pending');save();return{ok:1}}
 if(a==='admin_methods'){S.methods=d.methods;save();return{ok:1}}
 if(a==='admin_report'){A.rep.find(x=>x.id===d.id).status=d.action;save();return{ok:1}}
 if(a==='admin_problem'){A.prob.find(x=>x.id===d.id).status='resolved';save();return{ok:1}}
 save();return{ok:1};
}

  return sep+`<div class="b ${own?'o':'i'}" onclick="msgMenu('${m.id}')">${q?`<div class="q"><b>${mine(q)?'You':esc(c.user.name)}</b>${esc(prev(PT[q.id]))}</div>`:''}${isImg(PT[m.id])?`<img class="mi" src="${esc(PT[m.id].slice(IMG.length))}" onclick="event.stopPropagation();viewImg(this.src)">`:lnk(PT[m.id])}<time>${m.ed?'edited ':''}${tm(m.t)}${own?tick(m.seen&&S.set.rr):''}</time></div>`}).join('')+(c.typing?'<div class="typ"><i></i><i></i><i></i></div>':'');
 if(near)box.scrollTop=box.scrollHeight}
function toBottom(){const b=$('#msgs');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})}
function bar(l,t){const r=$('#rp');r.style.display='flex';$('#rpt').innerHTML=`<b>${l}</b>${esc(t)}`}
function cancelBar(){if(editing){$('#inp').value='';$('#sn').classList.remove('on')}editing=null;replyTo=null;$('#rp').style.display='none'}
async function send(){const i=$('#inp'),t=i.value.trim();if(!t||!cur)return;i.value='';$('#sn').classList.remove('on');buzz();await post(t)}
const EM={net:'No connection. Message not sent.',limit:'Daily new-chat limit reached.',blocked:'Unblock this user first.',joined:'This user just joined. Search them again.',pcap:'You can send up to 20 messages until they join.',nf:'User not found.',bad:'Message too large or invalid.',banned:'Your account is restricted.',server:'Server problem. Try again.',auth:'Open this app from Telegram.'};
async function post(t){const to=cur,c=S.chats[to];const e=await encR(t,await keyFor(c.user));
 if(editing&&!isImg(t)){const m=fm(editing);m.ct=e.ct;m.iv=e.iv;m.ed=1;PT[m.id]=t;api('edit',{to,id:m.id,ct:e.ct,iv:e.iv});editing=null;cancelBar();save();render();return}
 const m={id:Date.now(),from:S.me.id,ct:e.ct,iv:e.iv,t:Date.now(),reply:replyTo};PT[m.id]=t;c.msgs.push(m);cancelBar();save();render();drawChat(true);
 const r=await api('send',{to,ct:e.ct,iv:e.iv,reply:m.reply});
 if(r&&r.error){c.msgs=c.msgs.filter(x=>x.id!==m.id);toast(EM[r.error]||'Message not sent');render();return}
 if(CFG.API)sync(true)}
function shrink(f,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*r),h=Math.round(im.height*r),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('img'));im.src=u})}
async function sendPhoto(f){if(!f||!cur)return;if(!/^image\//.test(f.type))return toast('Only photos can be sent right now');
 toast('Preparing photo...');let d='';try{for(const [mx,q] of [[1024,.72],[860,.66],[720,.6],[600,.55],[480,.5]]){d=await shrink(f,mx,q);if(d.length<=85000)break}}catch(e){return toast('Could not read this photo')}
 if(d.length>90000)return toast('Photo is too large');buzz();await post(IMG+d)}
function viewImg(src){sheet(`<div class="gr"></div><img src="${esc(src)}" style="width:100%;border-radius:12px;display:block"><button class="btn s" onclick="closeSheet()">Close</button>`)}
function peerUI(){const c=S.chats[cur];if(!c)return;const u=c.user,tg=/^\d+$/.test(String(u.username))?'':`<button class="btn s" data-u="https://t.me/${esc(u.username)}" onclick="return openLnk(event,this)">Open in Telegram</button>`;
 sheet(`<div class="gr"></div><div style="text-align:center;display:flex;flex-direction:column;align-items:center">${av(u,96)}<div class="h2" style="margin-top:12px">${esc(u.name)}${u.prem?badge(18):''}</div><div class="sub" style="margin-bottom:4px;${isOn(u)?'color:var(--acc)':''}">${esc(seen(u))}</div></div>${u.bio?`<div class="card"><div class="mu" style="margin:0">Bio</div><div style="margin-top:4px;white-space:pre-wrap">${lnk(u.bio)}</div></div>`:''}<div class="card"><div class="mu" style="margin:0">Username</div><div style="margin-top:4px">@${esc(u.username)}</div></div>${tg}`)}
let NP=null;
function profUI(){NP=null;const m=S.me;sheet(`<div class="gr"></div><div class="h2">Edit profile</div><div style="text-align:center;padding:10px 0"><span id="ppv" style="display:inline-flex">${av(m,88)}</span><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn s sm" onclick="$('#fp').click()">Change photo</button><button class="btn s sm" onclick="NP='rm';toast('Telegram photo will be used')">Use Telegram photo</button></div></div><input class="in2" id="pn" maxlength="40" placeholder="Name" value="${esc(m.name)}"><textarea class="in2" id="pb" rows="3" maxlength="120" placeholder="Bio (about you)">${esc(m.bio||'')}</textarea><button class="btn" onclick="saveProf()">Save</button>`)}
async function pickProfPhoto(f){if(!f)return;try{let d='';for(const [mx,q] of [[192,.75],[160,.65],[128,.6]]){d=await shrink(f,mx,q);if(d.length<14000)break}if(d.length>=15000)return toast('Photo too large');NP=d;const p=$('#ppv');if(p)p.innerHTML=av(Object.assign({},S.me,{photo:d}),88)}catch(e){toast('Could not read this photo')}}
async function saveProf(){const n=$('#pn').value.trim(),b=$('#pb').value.trim();if(!n)return toast('Enter a name');const d={name:n,bio:b};if(NP==='rm')d.rmphoto=1;else if(NP)d.cphoto=NP;const r=await api('profile',d);if(!r||r.error)return toast((r&&EM[r.error])||'Could not save ('+(r&&r.error||'no reply')+')');closeSheet();toast('Profile updated');await sync(true)}
function msgMenu(id){selMsg=id;const m=fm(id),own=mine(m);
 sheet(`<div class="gr"></div><div class="it" onclick="setReply()">${ic('reply')}Reply</div>${isImg(PT[m.id])?'':`<div class="it" onclick="copyMsg()">${ic('copy')}Copy text</div>`}${own&&!isImg(PT[m.id])?`<div class="it" onclick="startEdit()">${ic('edit')}Edit</div>`:''}<div class="it r" onclick="delUI()">${ic('trash')}Delete</div>`)}
function setReply(){closeSheet();cancelBar();replyTo=selMsg;const m=fm(selMsg);bar('Reply to '+(mine(m)?'yourself':S.chats[cur].user.name),prev(PT[m.id]));$('#inp').focus()}
function startEdit(){closeSheet();cancelBar();const m=fm(selMsg);editing=m.id;bar('Edit message',PT[m.id]);const i=$('#inp');i.value=PT[m.id];$('#sn').classList.add('on');i.focus()}
function copyMsg(){closeSheet();try{navigator.clipboard.writeText(PT[fm(selMsg).id]);toast('Text copied')}catch(e){toast('Copy not supported')}}
function delUI(){const own=mine(fm(selMsg));sheet(`<div class="gr"></div><div class="h2">Delete message</div><div class="sub">${own?'Choose who should lose this message.':'This removes the message from your device.'}</div><button class="btn r" onclick="delMsg(0)">Delete for me</button>${own?`<button class="btn r" onclick="delMsg(1)">Delete for everyone</button>`:''}<button class="btn s" onclick="closeSheet()">Cancel</button>`)}
function delMsg(both){closeSheet();const c=S.chats[cur];c.msgs=c.msgs.filter(m=>String(m.id)!==String(selMsg));api('del',{to:cur,id:selMsg,both});save();render()}
function chatMenu(){sheet(`<div class="gr"></div><div class="it" onclick="ask('Clear history','All messages will be removed from your device.','Clear',()=>{clearChat(cur)})">${ic('trash')}Clear history</div><div class="it" onclick="reportUI()">${ic('flag')}Report user</div><div class="it r" onclick="ask('Block user','They will not be able to message you. Their chat is deleted from your list.','Block',blockU)">${ic('block')}Block user</div><div class="it r" onclick="ask('Delete chat','This chat will be removed from your list.','Delete',()=>delChat(cur))">${ic('trash')}Delete chat</div>`)}
function blockU(){const u=S.chats[cur].user;S.blocked.push({id:u.id,name:u.name});api('block',{to:u.id});delChat(u.id);toast('User blocked')}
function reportUI(){const R=['Spam','Abuse or harassment','Scam or fraud','Inappropriate content','Something else'];
 sheet(`<div class="gr"></div><div class="h2">Report user</div><div class="sub">The last 20 messages of this chat will be shared with the admin for review. Nothing else is shared.</div>${R.map((r,i)=>`<label class="it"><input type="radio" name="rr" value="${r}" ${i?'':'checked'}>${r}</label>`).join('')}<button class="btn r" onclick="sendReport()">Send report</button>`)}
async function sendReport(){const c=S.chats[cur],r=document.querySelector('input[name=rr]:checked').value,ev=c.msgs.slice(-20).map(m=>({who:mine(m)?'reporter':'reported',text:prev(PT[m.id]),t:m.t}));
 await api('report',{to:cur,reason:r,evidence:ev});closeSheet();toast('Report sent. Thank you.')}
function limitUI(){sheet(`<div class="gr"></div><div class="h2">Daily limit reached</div><div class="sub">Free accounts can start ${CFG.FREE} new chats per day.<br>Get Premium for ${CFG.PRICE} BDT to remove the limit.</div><button class="btn g" onclick="closeSheet();closeChat();tabTo('prem')">View Premium</button>`)}
function ask(t,s,l,fn){window._f=fn;sheet(`<div class="gr"></div><div class="h2">${t}</div><div class="sub">${s}</div><button class="btn r" onclick="closeSheet();_f()">${l}</button><button class="btn s" onclick="closeSheet()">Cancel</button>`)}
function sheet(h){$('#sh').innerHTML=h;$('#sh').classList.add('on');$('#bk').classList.add('on')}
function closeSheet(){$('#sh').classList.remove('on');$('#bk').classList.remove('on')}

/* ---- admin panel ---- */
async function openAdmin(){$('#adm').classList.add('on');await loadAdm();drawAdm()}
async function loadAdm(){const r=await api('admin_get');if(r&&!r.error)AD=r}
function drawAdm(){
 const pc=AD.pay.filter(x=>x.status==='pending').length,rc=AD.rep.filter(x=>x.status==='open').length,bc=AD.prob.filter(x=>x.status==='open').length,n=(l,c)=>l+(c?` (${c})`:'');
 const U=u=>`${esc(u.name)} <span class="mu">@${esc(u.username)}</span>`,ST=s=>`<span class="tag ${s==='pending'||s==='open'?'p':s==='approved'||s==='resolved'||s==='dismissed'?'a':'x'}">${s}</span>`,TM=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 let h='';
 if(atab==='pay')h=AD.pay.length?[...AD.pay].reverse().map(p=>`<div class="card"><div class="rw"><b>${U(p.user)}</b>${ST(p.status)}</div><div class="mu">${esc(p.method)}  |  TrxID ${esc(p.trx)}  |  ${esc(p.price||CFG.PRICE+' BDT')}</div><div class="mu">${TM(p.t)}</div>${p.status==='pending'?`<div class="acts"><button class="btn r sm" onclick="decide(${p.id},'rejected')">Reject</button><button class="btn sm" onclick="decide(${p.id},'approved')">Approve</button></div>`:''}</div>`).join(''):'<div class="empty">No payment requests yet.</div>';
 if(atab==='num')h=`<div class="sec">Payment methods shown to users</div>${AD.methods.map((m,i)=>`<div class="card"><input class="in2" style="margin:0 0 8px" data-i="${i}" data-f="name" value="${esc(m.name)}" placeholder="Method name (bKash, Nagad, USDT)"><input class="in2" style="margin:0 0 8px" data-i="${i}" data-f="number" value="${esc(m.number)}" placeholder="Number or wallet address"><input class="in2" style="margin:0 0 8px" data-i="${i}" data-f="price" value="${esc(m.price||'')}" placeholder="Amount (20 BDT, 0.20 USDT)">${/USDT|Binance/i.test(m.name)||m.net?`<select class="in2" style="margin:0 0 8px" data-i="${i}" data-f="net" onchange="netPick(${i},this.value)"><option value="">Select network</option>${NETS.map(n=>`<option value="${n}" ${m.net===n?'selected':''}>${n}</option>`).join('')}</select>`:''}<textarea class="in2" style="margin:0" rows="4" data-i="${i}" data-f="note" placeholder="Instructions shown to the user">${esc(m.note||'')}</textarea><div class="acts"><button class="btn r sm" onclick="mDel(${i})">Remove</button></div></div>`).join('')}<div class="sec">Quick add</div><div class="chips">${['bKash','Nagad','Rocket','USDT','Binance Pay'].map(n=>`<button class="chip" onclick="mAdd('${n}')">${n}</button>`).join('')}<button class="chip" onclick="mAdd('')">Custom</button></div><div style="padding:0 12px"><button class="btn" onclick="mSave()">Save changes</button></div>`;
 if(atab==='rep')h=AD.rep.length?[...AD.rep].reverse().map(r=>`<div class="card" onclick="repUI(${r.id})" style="cursor:pointer"><div class="rw"><b>${esc(r.reason)}</b>${ST(r.status)}</div><div class="mu">Reported: ${U(r.against)}</div><div class="mu">By: ${U(r.by)}  |  ${TM(r.t)}</div></div>`).join(''):'<div class="empty">No user reports.</div>';
 if(atab==='prob')h=AD.prob.length?[...AD.prob].reverse().map(p=>`<div class="card"><div class="rw"><b>${U(p.user)}</b>${ST(p.status)}</div><div style="margin-top:8px;white-space:pre-wrap">${esc(p.text)}</div><div class="mu">${TM(p.t)}</div>${p.status==='open'?`<div class="acts"><button class="btn sm" onclick="resolveP(${p.id})">Mark resolved</button></div>`:''}</div>`).join(''):'<div class="empty">No problem reports.</div>';
 $('#adm').innerHTML=`<div class="hdc"><button class="ib" onclick="$('#adm').classList.remove('on')">${ic('back')}</button><div class="t"><b>Admin panel</b><small>Private chats are never visible here</small></div></div><div class="ad">${[['pay',n('Payments',pc)],['num','Numbers'],['rep',n('Reports',rc)],['prob',n('Problems',bc)]].map(t=>`<button class="${atab===t[0]?'on':''}" onclick="atab='${t[0]}';drawAdm()">${t[1]}</button>`).join('')}</div><div style="flex:1;overflow-y:auto;padding-bottom:30px">${h}</div>`;
}
async function decide(id,d){await api('admin_pay',{id,decision:d});await loadAdm();drawAdm();render();toast(d==='approved'?'Payment approved':'Payment rejected')}
async function resolveP(id){await api('admin_problem',{id});await loadAdm();drawAdm()}
function mRead(){document.querySelectorAll('#adm [data-i]').forEach(e=>AD.methods[e.dataset.i][e.dataset.f]=e.value)}
const NETS=['TRC20 (Tron)','BEP20 (BNB Chain)','ERC20 (Ethereum)','Polygon','Solana','TON','Arbitrum','Optimism','Avalanche C-Chain','Base'];
function netPick(i,v){mRead();const m=AD.methods[i];m.net=v;if(v){if(/^USDT/i.test(m.name)||!m.name)m.name='USDT ('+v.split(' ')[0]+')';m.note='1. Send the exact amount on the '+v+' network only.\n2. Other networks will lose your funds.\n3. Paste the transaction hash (TxID) below.'}drawAdm()}
function mAdd(n){mRead();const u=/USDT|Binance/.test(n),bd=/bKash|Nagad|Rocket/.test(n);if(n==='USDT')n='USDT (TRC20)';AD.methods.push({id:Date.now(),net:n==='USDT (TRC20)'?'TRC20 (Tron)':'',name:n,number:'',price:u?'0.20 USDT':CFG.PRICE+' BDT',note:bd?'1. Open the '+n+' app and choose Send Money.\n2. Send the exact amount to the number above.\n3. Copy the Transaction ID and paste it below.':u?'1. Send the exact amount to the address above.\n2. Use the correct network only, other networks lose funds.\n3. Paste the transaction hash (TxID) below.':''});drawAdm()}
function mDel(i){mRead();AD.methods.splice(i,1);drawAdm()}
async function mSave(){mRead();AD.methods=AD.methods.filter(m=>m.name.trim()&&m.number.trim());await api('admin_methods',{methods:AD.methods});S.methods=AD.methods;drawAdm();toast('Payment numbers saved')}
function repUI(id){const r=AD.rep.find(x=>x.id===id);
 sheet(`<div class="gr"></div><div class="h2">${esc(r.reason)}</div><div class="sub">Reported: ${esc(r.against.name)} (@${esc(r.against.username)})<br>By: ${esc(r.by.name)} (@${esc(r.by.username)})</div>
 <div class="mu">Evidence submitted by the reporter (last ${r.evidence.length} messages)</div><div class="ev">${r.evidence.length?r.evidence.map(e=>`<p class="${e.who==='reported'?'rp':''}"><b>${e.who==='reported'?esc(r.against.name)+' (reported)':esc(r.by.name)}</b>${esc(e.text)}</p>`).join(''):'<p>No messages attached.</p>'}</div>
 <div class="acts"><button class="btn s sm" onclick="rAct(${id},'dismissed')">Dismiss</button><button class="btn sm" style="background:#e8833a" onclick="rAct(${id},'warned')">Warn</button><button class="btn r sm" onclick="rAct(${id},'banned')">Ban</button></div>`)}
async function rAct(id,a){await api('admin_report',{id,action:a});closeSheet();await loadAdm();drawAdm();toast('Action saved: '+a)}

/* ---- start ---- */
async function boot(){
 if(!CFG.API){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=Object.assign(S,d)}catch(e){}}
 try{K=JSON.parse(localStorage.getItem('inboxo_k'));if(!K&&CR){K=await genKeys();localStorage.setItem('inboxo_k',JSON.stringify(K))}}catch(e){K=null}
 if(CFG.API&&!(TG&&TG.initData)){document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#0e1621;color:#f5f5f5;font-family:sans-serif;line-height:1.6">Please open Inbox BD from Telegram.<br>টেলিগ্রামের বট থেকে খুলুন।</div>';return}
 const nm=TGU?((TGU.first_name||'')+' '+(TGU.last_name||'')).trim():'Demo User';
 S.me=Object.assign(S.me||{},{id:TGU?String(TGU.id):'demo',name:nm,username:TGU&&TGU.username||'demo_user'});
 if(S.day!==today()){S.day=today();S.used=0}
 $('#cb').innerHTML=ic('back');$('#att').innerHTML=ic('clip');$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';sendPhoto(f)};$('#fp').onchange=e=>{const f=e.target.files[0];e.target.value='';pickProfPhoto(f)};$('#cm').innerHTML=ic('more');$('#sn').innerHTML=ic('send',22);$('#sd').innerHTML=ic('down');$('#rpx').innerHTML=ic('close',20);
 $('#msgs').onscroll=function(){$('#sd').style.display=this.scrollHeight-this.scrollTop-this.clientHeight>260?'flex':'none'};
 $('#inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
 render();
 await api('init',{pub:K&&K.pub,name:nm});await sync();
 if(CFG.API){setInterval(sync,3000);setInterval(async()=>{if(!cur)return;const c=S.chats[cur];if(!c||String(cur).startsWith('p_'))return;const r=await api('presence',{to:cur});if(r&&r.user){c.user=Object.assign(c.user,r.user);c.user.at=Date.now();drawChat()}},10000)}
}
boot();
